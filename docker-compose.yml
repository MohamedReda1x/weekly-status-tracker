services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tracker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"], interval: 5s, timeout: 3s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD}@db:5432/tracker
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
volumes:
  pgdata:
